name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone repo
        uses: actions/checkout@v3

      - name: Generate the snake files in './dist/'
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#22D3EE&color_dots=#161b22,#0e2a4d,#1a4a8a,#1F6FEB,#22D3EE
            dist/github-snake-dark.svg?color_snake=#22D3EE&palette=github-dark&color_dots=#161b22,#0e2a4d,#1a4a8a,#1F6FEB,#22D3EE
            dist/github-snake.gif?color_snake=#22D3EE&color_dots=#161b22,#0e2a4d,#1a4a8a,#1F6FEB,#22D3EE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show build status
        run: git status

      - name: Push new files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update snake animations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
